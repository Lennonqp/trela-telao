<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Página não encontrada · Trela</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/estilo.css">
<style>
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 24px;text-align:center;
    background:radial-gradient(70% 45% at 50% 18%,rgba(255,63,164,.22),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(169,92,242,.25),transparent 70%),var(--bg)}

  h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;text-transform:uppercase;margin:6px 0 0;text-wrap:balance}

  p{margin:0;color:var(--muted);max-width:320px}
  a.ir{display:inline-block;margin-top:8px;border-radius:999px;padding:14px 26px;background:var(--neon);color:#140c1b;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.04em;font-size:14px}

</head>
<body>
  <div class="logo"><img src="/logo.svg?v=3" alt="trela"></div>
  <h1>Essa página <em>não existe</em></h1>
