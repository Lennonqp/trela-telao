<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trela">
<title>Trela</title>
<link rel="stylesheet" href="estilo.css?v=202610151941">
<style>
  html,body{height:100%;overflow:hidden}
  :root{--panel2:#201929}
  .app{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden;padding-top:env(safe-area-inset-top)}
  .tela{position:absolute;inset:env(safe-area-inset-top) 0 0 0;display:flex;flex-direction:column;background:var(--bg)}
  .tela.sub{animation:entraLado .22s ease-out}
  @keyframes entraLado{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
  .appbar{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .appbar .logo{font-size:38px;margin-right:auto}
  .appbar h3{margin:0 auto 0 0;font:700 16px/1.2 var(--f-body);min-width:0}
  .ico{position:relative;background:none;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;font-size:20px;color:var(--ink);flex:none}
  .ico.voltar{border:0;font-size:26px;width:32px}
  .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--neon);color:#1d0612;font:700 10px/18px var(--f-mono);padding:0 5px}
  .av{position:relative;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--f-body);color:#140c1b;background:var(--c,var(--lilas))}
  .av.p{width:28px;height:28px;font-size:12px}
  .av.g{width:72px;height:72px;font-size:28px}
  .av.com-foto{background-size:cover;background-position:center}
  .troca-foto{position:relative;cursor:pointer;border-radius:50%;margin:0;display:block}
  .troca-foto .av.g{width:88px;height:88px;font-size:34px}
  .troca-foto .lapis{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--neon);display:grid;place-items:center;font-size:16px;color:#fff;box-shadow:0 0 0 3px var(--panel2)}
  .troca-foto:focus-within{outline:2px solid var(--lilas);outline-offset:3px}
  .av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;min-width:9px;min-height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
  .eu{background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
  .rolagem{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

  /* Login */
  #tLogin{justify-content:center;padding:28px 24px;gap:14px;overflow-y:auto;background:radial-gradient(70% 45% at 50% 18%,rgba(255,63,164,.22),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(169,92,242,.25),transparent 70%),var(--bg)}
  #tLogin .logo{font-size:96px;text-align:center}
  .tag{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;text-transform:uppercase;text-align:center;margin:0 0 10px;text-wrap:balance}
  .tag em{font-style:normal;color:var(--laranja)}
  .entrar{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:999px;padding:14px;font:700 15px/1 var(--f-body);cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .entrar.google{background:var(--ink);color:#1a1320;border-color:var(--ink)}
  .entrar .g{width:22px;height:22px;border-radius:50%;background:#1a1320;color:var(--ink);display:grid;place-items:center;font:700 13px/1 var(--f-body)}
  .entrar:disabled{opacity:.5}
  .ou{display:flex;align-items:center;gap:10px;color:var(--muted);font:400 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
  .ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--line)}
  #formEmail{display:flex;flex-direction:column;gap:10px}
  .links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .troca{background:none;border:0;color:var(--lilas);font:700 13px var(--f-body);cursor:pointer;padding:4px 0}
  .letra{font-size:12px;color:var(--muted);text-align:center;margin:0}
  .erro-l{font-size:13px;color:var(--laranja);text-align:center;min-height:18px;margin:0}
  .erro-l.ok{color:var(--ok)}

  /* Home */
  #tHome h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;text-transform:uppercase;margin:0;text-align:center}
  #tHome h2 em{font-style:normal;color:var(--laranja)}
  .abas{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .abas button{background:none;border:0;color:var(--muted);border-radius:999px;padding:10px;font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
  .abas button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
  .abas .n{margin-left:5px;font:700 10px/1 var(--f-mono);opacity:.75}
  .foto-pick{display:grid;place-items:center;min-height:130px;border:1px dashed var(--lilas);border-radius:14px;cursor:pointer;overflow:hidden;color:var(--lilas);font:700 13px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:12px;margin:0}
  .foto-pick img{max-height:240px;border-radius:8px;display:block}
  .chars{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
  .cores{display:flex;gap:8px}
  .cores button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 4px;font:700 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
  .cores button[aria-pressed="true"]{border-color:var(--c);color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
  .status{border-radius:14px;padding:14px;text-align:center;font-size:14px;background:var(--panel);border:1px solid var(--line)}
  .status b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.05;text-transform:uppercase}
  .status.agora{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 24px rgba(255,63,164,.35)}
  .status.agora b{color:var(--neon)}
  .status.erro{border-color:var(--laranja);color:var(--laranja)}
  .regras{font-size:12px;color:var(--muted);text-align:center;margin:0}
  .feed-title{font-family:var(--f-display);font-weight:400;font-size:26px;text-transform:uppercase;margin:10px 0 0;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
  .feed-title small{font:400 11px var(--f-mono);letter-spacing:.1em;color:var(--muted)}
  .feed{display:flex;flex-direction:column;gap:12px}
  .item{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
  .item.bar{border-left-color:var(--laranja)}
  .selo{align-self:flex-start;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:var(--laranja);color:#1a0b05;padding:2px 8px;border-radius:99px}
  .item img.foto{border-radius:8px;width:100%;max-height:360px;object-fit:cover;display:block;background:var(--panel2);min-height:120px}
  .item p{margin:0;overflow-wrap:anywhere}
  .quem{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink)}
  .quem span{font:700 13px/1.2 var(--f-body)}
  .quem small{display:block;font:400 10px var(--f-mono);color:var(--muted)}
  .amigo-tag{font:700 9px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin-left:5px}
  .linha{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .reagir{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 10px;font:500 14px/1 var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums}
  .reagir[aria-pressed="true"]{border-color:var(--neon);background:rgba(255,63,164,.12)}
  .comentar{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 12px/1 var(--f-body);cursor:pointer}
  .previa{background:none;border:0;padding:0;text-align:left;font-size:13px;color:var(--muted);cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .previa b{color:var(--ink)}
  .fade{position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(transparent,var(--bg) 85%);pointer-events:none;transition:opacity .25s}
  .mais{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;display:flex;gap:6px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:opacity .25s,transform .25s;white-space:nowrap}
  .mais i{font-style:normal;display:inline-block;animation:quica 1.4s ease-in-out infinite}
  @keyframes quica{0%,100%{transform:translateY(-1px)}50%{transform:translateY(3px)}}
  .some{opacity:0;pointer-events:none}
  .mais.some{transform:translate(-50%,10px)}
  .instalar{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--lilas);border-radius:14px;padding:12px;margin-top:6px}
  .instalar img{border-radius:10px;flex:none}
  .instalar div{flex:1;min-width:0;font-size:13px;color:var(--muted)}
  .instalar b{display:block;color:var(--ink);font-size:14px}
  .fechar-i{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;flex:none}
  .vazio{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center}

  /* Comentários e chat */
  .post-mini{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
  .post-mini img{width:60px;height:60px;object-fit:cover;border-radius:6px;flex:none}
  .post-mini p{margin:0;font-size:14px;overflow-wrap:anywhere}
  .post-mini small{font:400 10px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .com{display:flex;gap:10px;align-items:flex-start}
  .com .bolha{min-width:0}
  .com .bolha b{font-size:13px;cursor:pointer}
  .com .bolha p{margin:1px 0 0;overflow-wrap:anywhere}
  .com .bolha small{font:400 10px var(--f-mono);color:var(--muted)}
  .mencao{color:var(--neon);font-weight:700;cursor:pointer}
  .vazio-s{color:var(--muted);font-size:14px;text-align:center;padding:22px 8px}
  .compor{flex:none;position:relative;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
  .compor input{border-radius:999px;padding:11px 16px}
  .compor button{flex:none;background:var(--neon);color:#1d0612;border:0;border-radius:999px;width:46px;font:700 18px/1 var(--f-body);cursor:pointer}
  .sugestoes{position:absolute;left:12px;right:12px;bottom:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 -8px 24px rgba(0,0,0,.4)}
  .sugestoes button{display:flex;align-items:center;gap:9px;background:none;border:0;border-radius:8px;padding:7px;cursor:pointer;text-align:left;font-size:14px;color:var(--ink)}
  .sugestoes button:hover,.sugestoes button:focus-visible{background:var(--line)}
  .aviso-s{font-size:12px;color:var(--muted);padding:0 16px 8px;text-align:center}
  .msgs{display:flex;flex-direction:column;gap:6px}
  .msg{max-width:78%;padding:9px 13px;border-radius:18px;overflow-wrap:anywhere;background:var(--panel2)}
  .msg.minha{align-self:flex-end;background:var(--neon);color:#1d0612;border-bottom-right-radius:4px}
  .msg.dela{align-self:flex-start;border-bottom-left-radius:4px}
  .msg.oculta{font-style:italic;color:var(--muted);cursor:pointer}
  .msg small{display:block;font:400 9px var(--f-mono);opacity:.7;margin-top:2px}
  .sistema{align-self:center;font:400 12px var(--f-mono);color:var(--muted);text-align:center;max-width:90%}
  .chat-quem{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font:700 16px/1.2 var(--f-body)}
  .chat-quem small{display:block;font:400 12px/1.3 var(--f-body);color:var(--muted)}
  .chat-quem small.on{color:var(--ok)}

  /* Galera e perfil */
  .secao{font:400 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
  .pessoa{display:flex;gap:10px;align-items:center;border-radius:12px;padding:8px}
  .pessoa .abrir{flex:1;min-width:0;display:flex;gap:11px;align-items:center;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
  .pessoa .txt{min-width:0}
  .pessoa .txt b{display:block}
  .pessoa .txt span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pessoa .txt span.on{color:var(--ok)}
  .pessoa .txt span.nova{color:var(--ink);font-weight:700}
  .pt{width:10px;height:10px;border-radius:50%;background:var(--neon);flex:none}
  .mini{flex:none;border-radius:999px;padding:8px 13px;font:700 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
  .mini.sim{background:var(--neon);border-color:var(--neon);color:#1d0612}
  .mini.feito{color:var(--muted);cursor:default}
  .nota{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}
  .perfil-topo{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0 4px}
  .perfil-topo h4{margin:0;font:700 22px/1.2 var(--f-body)}
  .perfil-topo p{margin:0;font-size:13px;color:var(--muted)}
  .perfil-topo p.on{color:var(--ok)}
  .acoes-p{display:flex;gap:8px;width:100%}
  .acoes-p .bt{flex:1}
  .dia-p{font:700 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lilas);margin:4px 0 -4px}
  .mais-p{width:36px;height:36px;padding:0;font-size:18px;letter-spacing:0}

  /* Folha e aviso */
  .veu{position:absolute;inset:0;background:rgba(5,3,8,.6);display:flex;align-items:flex-end;z-index:5}
  .folha{width:100%;background:var(--panel2);border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;animation:sobeF .2s ease-out}
  @keyframes sobeF{from{transform:translateY(40px)}to{transform:none}}
  .folha h4{margin:0;font:700 19px/1.2 var(--f-body)}
  .folha p{margin:0;font-size:14px;color:var(--muted)}
  .bt{border-radius:999px;padding:12px;font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
  .bt.sim{background:var(--neon);border-color:var(--neon);color:#1d0612}
  .bt.perigo{color:var(--laranja);border-color:var(--laranja)}
  .folha .bt,.folha input{width:100%}
  .toast{position:absolute;left:14px;right:14px;top:calc(70px + env(safe-area-inset-top));z-index:6;background:var(--panel2);border:1px solid var(--ok);border-radius:14px;padding:11px 13px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:sobeF .2s ease-out;cursor:pointer}
  .carregando{display:grid;place-items:center;height:100%;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){.tela.sub,.folha,.toast,.mais i{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="tela carregando" id="tCarregando"><div style="display:flex;flex-direction:column;align-items:center;gap:14px"><div class="logo" style="font-size:72px"><img src="logo.svg?v=3" alt="trela"></div><p id="carregandoTxt" style="margin:0;color:var(--muted);font-size:14px"></p></div></div>

  <!-- Login -->
  <div class="tela" id="tLogin" hidden>
    <div class="logo"><img src="logo.svg?v=3" alt="trela"></div>
    <p class="tag">Entra na <em>noite</em> do Trela</p>
    <button class="entrar google" id="btnGoogle" type="button"><span class="g" aria-hidden="true">G</span> Continuar com Google</button>
    <div class="ou">ou</div>
    <form id="formEmail" novalidate>
      <div id="campoNome" hidden><label for="lNome">Teu nome</label><input id="lNome" maxlength="20" placeholder="Ex.: Lu" autocomplete="given-name"></div>
      <div><label for="lEmail">E-mail</label><input id="lEmail" type="email" placeholder="tu@email.com" autocomplete="email"></div>
      <div><label for="lSenha">Senha</label><input id="lSenha" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password"></div>
      <p class="erro-l" id="erroLogin" role="status"></p>
      <button class="entrar" type="submit" id="btnEmail">Entrar</button>
      <div class="links">
        <button class="troca" type="button" id="trocaModo">Não tem conta? Cria uma</button>
        <button class="troca" type="button" id="esqueci">Esqueci a senha</button>
      </div>
    </form>
    <p class="letra">Teus amigos e conversas ficam salvos na tua conta.</p>
  </div>

  <!-- Home -->
  <div class="tela" id="tHome" hidden>
    <div class="appbar">
      <div class="logo"><img src="logo.svg?v=3" alt="trela"></div>
      <button class="eu" id="btnEu" type="button" aria-label="Teu perfil"></button>
      <button class="ico" id="btnGalera" type="button" aria-label="Amigos e conversas"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4A8 8 0 1 1 20 12z"/></svg><span class="badge" id="badge" hidden></span></button>
    </div>
    <div class="rolagem" id="homeScroll">
      <form id="sendForm" novalidate style="display:flex;flex-direction:column;gap:12px">
        <h2>Manda pro <em>telão</em></h2>
        <div class="abas" role="tablist">
          <button type="button" role="tab" data-tipo="recado" aria-selected="true">Recado</button>
          <button type="button" role="tab" data-tipo="foto" aria-selected="false">Foto</button>
        </div>
        <div id="campoFoto" hidden>
          <label class="foto-pick" for="foto"><span id="fotoTxt">Toca pra tirar ou escolher uma foto</span><img id="fotoPrev" alt="Prévia da foto" hidden></label>
          <input id="foto" type="file" accept="image/*" hidden>
        </div>
        <div>
          <label for="texto" id="rotTexto">Recado</label>
          <textarea id="texto" maxlength="120" placeholder="Parabéns, Ju! 27 aninhos no Trela!"></textarea>
          <div class="chars" id="chars">0/120</div>
        </div>
        <div class="cores" id="cores">
          <button type="button" data-cor="neon" aria-pressed="true" style="--c:var(--neon)">Neon</button>
          <button type="button" data-cor="lilas" aria-pressed="false" style="--c:var(--lilas)">Lilás</button>
          <button type="button" data-cor="laranja" aria-pressed="false" style="--c:var(--laranja)">Laranja</button>
        </div>
        <button class="btn" id="enviar" type="submit">Mandar pro telão</button>
        <div class="status" id="status" role="status" hidden></div>
        <p class="regras" id="regras">Xingamento, link ou telefone passam pela equipe antes.</p>
      </form>
      <div class="instalar" id="instalar" hidden>
        <img src="icone-192.png" alt="" width="44" height="44">
        <div><b>Coloca o Trela na tela inicial</b><span id="instalarTxt"></span></div>
        <button type="button" class="mini sim" id="instalarBtn" hidden>Instalar</button>
        <button type="button" class="fechar-i" id="instalarFechar" aria-label="Fechar">×</button>
      </div>
      <h3 class="feed-title" id="feedTitle">Rolou hoje <small id="feedCount"></small></h3>
      <div class="feed" id="feed"><div class="vazio">Carregando…</div></div>
      <div style="height:30px"></div>
    </div>
    <div class="fade" id="fade"></div>
    <button class="mais" id="mais" type="button"><i>↓</i> <span id="maisTxt">Rolou hoje</span></button>
  </div>

  <!-- Comentários -->
  <div class="tela sub" id="tComs" hidden>
    <div class="appbar"><button class="ico voltar" type="button" data-voltar aria-label="Voltar">‹</button><h3>Comentários</h3></div>
    <div class="rolagem" id="comsScroll"></div>
    <div class="aviso-s" id="comsAviso" hidden></div>
    <form class="compor" id="comsForm" novalidate>
      <div class="sugestoes" id="sug" hidden></div>
      <input id="comsInput" maxlength="100" placeholder="Comenta aí… usa @ pra marcar" aria-label="Comentário" autocomplete="off">
      <button type="submit" aria-label="Enviar">↑</button>
    </form>
  </div>

  <!-- Galera -->
  <div class="tela sub" id="tGalera" hidden>
    <div class="appbar"><button class="ico voltar" type="button" data-voltar aria-label="Voltar">‹</button><h3>Galera</h3></div>
    <div style="padding:12px 16px 0"><div class="abas" role="tablist" id="abasGalera">
      <button type="button" role="tab" data-aba="amigos" aria-selected="true">Amigos<span class="n" id="nAmigos"></span></button>
      <button type="button" role="tab" data-aba="agora" aria-selected="false">No Trela agora<span class="n" id="nAgora"></span></button>
    </div></div>
    <div class="rolagem" id="galeraScroll"></div>
  </div>

  <!-- Perfil -->
  <div class="tela sub" id="tPerfil" hidden>
    <div class="appbar"><button class="ico voltar" type="button" data-voltar aria-label="Voltar">‹</button><h3 id="perfilTitulo">Perfil</h3></div>
    <div class="rolagem" id="perfilScroll"></div>
  </div>

  <!-- Chat -->
  <div class="tela sub" id="tChat" hidden>
    <div class="appbar">
      <button class="ico voltar" type="button" data-voltar aria-label="Voltar">‹</button>
      <span id="chatAv"></span>
      <button type="button" class="chat-quem" id="chatQuem"></button>
      <button class="ico" id="chatMenu" type="button" aria-label="Opções">⋯</button>
    </div>
    <div class="rolagem" id="chatScroll"><div class="msgs" id="msgs"></div></div>
    <form class="compor" id="chatForm" novalidate>
      <input id="chatInput" maxlength="500" placeholder="Mensagem…" aria-label="Mensagem" autocomplete="off">
      <button type="submit" aria-label="Enviar">↑</button>
    </form>
  </div>

  <div class="veu" id="veu" hidden><div class="folha" id="folha"></div></div>
  <div class="toast" id="toast" hidden role="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js?v=202610151941"></script>
<script src="comum.js?v=202610151941"></script>
<script>
  const $ = s => document.querySelector(s);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const auth = appTrela.auth();
  const FS = firebase.firestore;
  const semEspaco = n => n.replace(/\s+/g, "");

  let EU = null;           // { uid, nome, cor }
  let parar = [];          // listeners a desligar quando sair
  const S = {
    posts: [], postsMap: new Map(),
    amizades: new Map(),   // outroUid -> { status, de, para }
    conversas: new Map(),  // outroUid -> { ultima, lidaPor }
    avisos: [],            // marcações não lidas
    bloqueados: new Set(),
    noBar: []              // perfis que abriram o app nas últimas 3 h
  };

  // ---------- Perfis (cache) ----------
  const perfis = new Map();
  function perfil(uid) {
    if (EU && uid === EU.uid) return { id: uid, ...EU, ultimoAcesso: FS.Timestamp.now() };
    if (!perfis.has(uid)) {
      perfis.set(uid, { id: uid, nome: "…", cor: corDe(uid) });
      db.doc("usuarios/" + uid).get().then(s => { perfis.set(uid, s.exists ? { id: uid, ...s.data() } : { id: uid, nome: "Alguém", cor: corDe(uid) }); redesenhar(); }).catch(() => {});
    }
    return perfis.get(uid);
  }
  const online = p => Date.now() - ms(p.ultimoAcesso) < ONLINE_MS;
  const noBar = p => Date.now() - ms(p.ultimoAcesso) < NO_BAR_MS;
  // Fotos de perfil: ficam em /avatares/{uid}; o perfil guarda só a versão (fotoV)
  const fotosPerfil = new Map(); // "uid:versão" -> dataURL | null | "carregando"
  function fotoPerfil(uid, fotoV) {
    if (!fotoV) return null;
    const k = uid + ":" + ms(fotoV);
    if (!fotosPerfil.has(k)) {
      fotosPerfil.set(k, "carregando");
      db.doc("avatares/" + uid).get().then(s => { fotosPerfil.set(k, s.exists ? s.data().data : null); redesenhar(); }).catch(() => fotosPerfil.set(k, null));
    }
    const v = fotosPerfil.get(k);
    return v === "carregando" ? null : v;
  }
  function avatar(uid, cls) {
    const p = perfil(uid);
    const a = el("span", "av" + (cls ? " " + cls : "") + (uid !== EU?.uid && online(p) ? " on" : ""), (p.nome || "?")[0].toUpperCase());
    a.style.setProperty("--c", p.cor || corDe(uid)); a.setAttribute("aria-hidden", "true");
    const f = fotoPerfil(uid, p.fotoV);
    if (f) { a.textContent = ""; a.style.backgroundImage = "url(" + f + ")"; a.classList.add("com-foto"); }
    return a;
  }

  // Corta a foto em quadrado e diminui (leve pra carregar em todo canto)
  function fotoQuadrada(arquivo, lado = 256) {
    return new Promise((ok, erro) => {
      const url = URL.createObjectURL(arquivo), img = new Image();
      img.onload = () => {
        const m = Math.min(img.width, img.height), c = document.createElement("canvas");
        c.width = c.height = lado;
        c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, lado, lado);
        URL.revokeObjectURL(url);
        const d = c.toDataURL("image/jpeg", 0.8);
        d.length > 110000 ? erro(new Error("grande")) : ok(d);
      };
      img.onerror = () => { URL.revokeObjectURL(url); erro(new Error("formato")); };
      img.src = url;
    });
  }
  const relacao = uid => {
    if (S.bloqueados.has(uid)) return "bloqueado";
    const a = S.amizades.get(uid); if (!a) return "nada";
    if (a.status === "aceita") return "amigo";
    return a.de === EU.uid ? "enviado" : "recebido";
  };
  const ehAmigo = uid => relacao(uid) === "amigo";

  // Texto com @menções clicáveis (usa a lista salva no comentário)
  function comMencoes(alvo, texto, mencoes) {
    alvo.replaceChildren();
    const mapa = new Map((mencoes || []).map(m => [m.tag.toLowerCase(), m.uid]));
    texto.split(/(@[\p{L}\d_]+)/u).forEach(parte => {
      const uid = parte.startsWith("@") && mapa.get(parte.slice(1).toLowerCase());
      if (uid) { const s = el("span", "mencao", parte); s.onclick = e => { e.stopPropagation(); abrirPerfil(uid); }; alvo.append(s); }
      else if (parte) alvo.append(parte);
    });
    return alvo;
  }

  // ---------- Navegação ----------
  // Cada tela que abre por cima entra no histórico do navegador, pra o botão
  // voltar do celular fechar a tela (e não sair do app de volta pra câmera).
  let pilha = [];
  const mostrarTela = id => document.querySelectorAll("#app .tela").forEach(t => t.hidden = t.id !== id);
  function ir(id) {
    mostrarTela(id);
    if (pilha[pilha.length - 1] === id) return;
    pilha.push(id);
    try {
      if (pilha.length === 1) history.replaceState({ trela: 1, n: 1 }, "");
      else history.pushState({ trela: 1, n: pilha.length }, "");
    } catch (e) {}
  }
  function telaAtual() { return pilha[pilha.length - 1]; }
  // Volta uma tela (sem mexer no histórico)
  function voltarTela() {
    if (pilha.length <= 1) return;
    if (telaAtual() === "tChat") fecharChat();
    if (telaAtual() === "tComs") fecharComs();
    pilha.pop();
    mostrarTela(telaAtual()); redesenhar();
  }
  // Botão ‹ do app: usa o histórico, igual ao voltar do celular
  function voltar() {
    if (pilha.length <= 1) return;
    const estado = history.state;
    if (estado && estado.trela && estado.n === pilha.length) history.back();
    else voltarTela();
  }
  window.addEventListener("popstate", e => {
    // Com uma janelinha aberta (perfil, menu, confirmação), o voltar só fecha ela
    if (!$("#veu").hidden && !folhaObrigatoria) {
      fecharFolha();
      try { history.pushState({ trela: 1, n: pilha.length }, ""); } catch (err) {}
      return;
    }
    if (!$("#veu").hidden && folhaObrigatoria) {
      try { history.pushState({ trela: 1, n: pilha.length }, ""); } catch (err) {}
      return;
    }
    const n = e.state && e.state.trela ? e.state.n : 1;
    while (pilha.length > Math.max(1, n)) voltarTela();
  });
  document.querySelectorAll("[data-voltar]").forEach(b => b.onclick = voltar);

  let folhaObrigatoria = false;
  function folha(conteudo, obrigatoria) { folhaObrigatoria = !!obrigatoria; $("#folha").replaceChildren(...conteudo); $("#veu").hidden = false; }
  function fecharFolha() { $("#veu").hidden = true; folhaObrigatoria = false; }
  $("#veu").addEventListener("click", e => { if (e.target.id === "veu" && !folhaObrigatoria) fecharFolha(); });
  function bt(txt, cls, f) { const b = el("button", "bt" + (cls ? " " + cls : ""), txt); b.type = "button"; b.onclick = f; return b; }
  let toastT;
  function toast(uid, texto, aoTocar) {
    const t = $("#toast"); t.replaceChildren(avatar(uid, "p"), el("span", "", texto)); t.hidden = false;
    t.onclick = () => { t.hidden = true; aoTocar && aoTocar(); };
    clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3500);
  }
  function erroToast(texto) { const t = $("#toast"); t.replaceChildren(el("span", "", texto)); t.style.borderColor = "var(--laranja)"; t.hidden = false; t.onclick = () => t.hidden = true; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; t.style.borderColor = ""; }, 3500); }

  let redesenhoAgendado = false;
  function redesenhar() {
    if (redesenhoAgendado) return; redesenhoAgendado = true;
    requestAnimationFrame(() => {
      redesenhoAgendado = false;
      if (!EU) return;
      renderBadge(); desenharEu();
      const t = telaAtual();
      if (t === "tHome") { renderFeed(); checarMais(); }
      if (t === "tGalera") renderGalera();
      if (t === "tPerfil") renderPerfil();
      if (t === "tComs") renderComs();
      if (t === "tChat") renderChatTopo();
    });
  }

  // ================= LOGIN =================
  let modoCriar = false, nomePendente = "";
  const erroLogin = (t, ok) => { $("#erroLogin").textContent = t; $("#erroLogin").className = "erro-l" + (ok ? " ok" : ""); };
  const MSG_ERRO = {
    "auth/invalid-credential": "E-mail ou senha não conferem.",
    "auth/wrong-password": "E-mail ou senha não conferem.",
    "auth/user-not-found": "Não achamos conta com esse e-mail. Cria uma!",
    "auth/email-already-in-use": "Esse e-mail já tem conta. É só entrar.",
    "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
    "auth/invalid-email": "Confere o e-mail.",
    "auth/too-many-requests": "Muitas tentativas. Espera um pouquinho e tenta de novo.",
    "auth/network-request-failed": "Sem internet. Confere a conexão.",
    "auth/unauthorized-domain": "Este endereço ainda não está liberado no Firebase (Authentication → Configurações → Domínios autorizados → adicionar " + location.hostname + ").",
    "auth/operation-not-allowed": "O login com Google não está ativado no Firebase (Authentication → Método de login → Google)."
  };

  // Login com Google pela janelinha (popup). O modo "redirecionar" não funciona em
  // sites fora do Firebase Hosting nos navegadores que bloqueiam cookies de terceiros
  // (a pessoa volta pro login sem entrar), então ele não é usado.
  const btnGoogle = $("#btnGoogle"), textoGoogle = btnGoogle.innerHTML;
  btnGoogle.onclick = async () => {
    erroLogin("");
    btnGoogle.disabled = true; btnGoogle.textContent = "Abrindo o Google…";
    const prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({ prompt: "select_account" });
    try {
      await auth.signInWithPopup(prov);
      carregando("Entrando…");
    } catch (e) {
      if (e.code === "auth/popup-blocked") erroLogin("O navegador bloqueou a janela do Google. Toca de novo no botão ou libera pop-ups pra este site.");
      else if (e.code === "auth/operation-not-supported-in-this-environment" || e.code === "auth/web-storage-unsupported") erroLogin("Esse navegador não deixa entrar com Google. Abre o link no Chrome ou Safari, ou entra com e-mail.");
      else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") erroLogin(MSG_ERRO[e.code] || "Não deu pra entrar com o Google. Tenta de novo.");
    } finally { btnGoogle.disabled = false; btnGoogle.innerHTML = textoGoogle; }
  };
  // Se alguém voltou de um login antigo por redirecionamento, mostra o erro em vez de ficar parado
  auth.getRedirectResult().catch(e => { if (e && e.code) erroLogin(MSG_ERRO[e.code] || "Não deu pra entrar com o Google. Tenta de novo."); });
  function carregando(txt) { $("#carregandoTxt").textContent = txt || ""; document.querySelectorAll("#app .tela").forEach(t => t.hidden = t.id !== "tCarregando"); }
  $("#trocaModo").onclick = () => {
    modoCriar = !modoCriar;
    $("#campoNome").hidden = !modoCriar;
    $("#btnEmail").textContent = modoCriar ? "Criar conta" : "Entrar";
    $("#trocaModo").textContent = modoCriar ? "Já tenho conta" : "Não tem conta? Cria uma";
    $("#esqueci").hidden = modoCriar;
    $("#lSenha").autocomplete = modoCriar ? "new-password" : "current-password";
    erroLogin("");
  };
  $("#esqueci").onclick = async () => {
    const email = $("#lEmail").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) return erroLogin("Escreve teu e-mail ali em cima primeiro.");
    try { await auth.sendPasswordResetEmail(email); erroLogin("Te mandamos um e-mail pra trocar a senha.", true); }
    catch (e) { erroLogin(MSG_ERRO[e.code] || "Não deu pra mandar o e-mail. Tenta de novo."); }
  };
  $("#formEmail").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("#lEmail").value.trim(), senha = $("#lSenha").value, nome = $("#lNome").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) return erroLogin("Confere o e-mail.");
    if (senha.length < 6) return erroLogin("A senha precisa ter pelo menos 6 caracteres.");
    if (modoCriar && !nome) return erroLogin("Diz como a galera vai te chamar.");
    if (modoCriar && motivoSuspeito(nome)) return erroLogin("Escolhe outro nome.");
    erroLogin(""); $("#btnEmail").disabled = true;
    try {
      if (modoCriar) { nomePendente = nome; const c = await auth.createUserWithEmailAndPassword(email, senha); await c.user.updateProfile({ displayName: nome }); }
      else await auth.signInWithEmailAndPassword(email, senha);
    } catch (err) { erroLogin(MSG_ERRO[err.code] || "Não deu pra entrar. Tenta de novo."); }
    finally { $("#btnEmail").disabled = false; }
  });

  function pedirNome(sugestao) {
    return new Promise(ok => {
      const inp = el("input"); inp.maxLength = 20; inp.placeholder = "Ex.: Lu"; inp.value = sugestao || ""; inp.setAttribute("aria-label", "Teu nome");
      const aviso = el("p", "", "É o nome que a galera vê nos teus posts e conversas.");
      const b = bt("Continuar", "sim", () => {
        const n = inp.value.trim();
        if (!n) return inp.focus();
        if (motivoSuspeito(n)) { aviso.textContent = "Escolhe outro nome."; aviso.style.color = "var(--laranja)"; return; }
        fecharFolha(); ok(n);
      });
      inp.addEventListener("keydown", e => { if (e.key === "Enter") b.click(); });
      folha([el("h4", "", "Como a galera vai te chamar?"), aviso, inp, b], true);
      setTimeout(() => inp.focus(), 50);
    });
  }

  auth.onAuthStateChanged(async u => {
    parar.forEach(f => f()); parar = []; clearInterval(batida);
    if (!u) { EU = null; pilha = []; ir("tLogin"); return; }
    carregando("Entrando…");
    try {
      const ref = db.doc("usuarios/" + u.uid);
      const [susp, s] = await Promise.all([db.doc("suspensos/" + u.uid).get(), ref.get()]);
      if (susp.exists) {
        folha([el("h4", "", "Conta suspensa"), el("p", "", "A equipe do Trela suspendeu tua conta. Fala com alguém no balcão."), bt("Ok", "sim", () => { fecharFolha(); auth.signOut(); })], true);
        return;
      }
      let nome, cor = corDe(u.uid);
      if (!s.exists) {
        nome = (nomePendente || u.displayName || "").trim().split(/\s+/).slice(0, 2).join(" ").slice(0, 20);
        if (!nome || motivoSuspeito(nome)) nome = await pedirNome(nome);
        await ref.set({ nome, cor, criado: agoraServidor(), ultimoAcesso: agoraServidor() });
      } else { nome = s.data().nome; cor = s.data().cor || cor; }
      EU = { uid: u.uid, nome, cor, fotoV: s.exists ? s.data().fotoV || null : null };
      iniciarApp();
    } catch (e) {
      folha([el("h4", "", "Não deu pra carregar"), el("p", "", "Confere a internet e tenta de novo."), bt("Tentar de novo", "sim", () => location.reload())], true);
    }
  });

  // ================= APP =================
  let batida = null;
  function marcarPresenca() { if (EU && document.visibilityState !== "hidden") db.doc("usuarios/" + EU.uid).set({ nome: EU.nome, cor: EU.cor, ultimoAcesso: agoraServidor() }, { merge: true }).catch(() => {}); }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") marcarPresenca(); });

  // ---------- Sugestão de instalar na tela inicial ----------
  let pedidoInstalar = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); pedidoInstalar = e; mostrarInstalar(); });
  function mostrarInstalar() {
    const jaInstalado = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    if (jaInstalado || guardado.ler("trela-instalar-fechado", false) || !EU) return;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    $("#instalarTxt").textContent = pedidoInstalar ? "Abre que nem app, direto do ícone."
      : ios ? "No Safari: toca em Compartilhar (□↑) e depois em “Adicionar à Tela de Início”."
      : "No menu do navegador (⋮), toca em “Adicionar à tela inicial”.";
    $("#instalarBtn").hidden = !pedidoInstalar;
    $("#instalar").hidden = false;
  }
  $("#instalarBtn").onclick = async () => {
    if (!pedidoInstalar) return;
    pedidoInstalar.prompt();
    const r = await pedidoInstalar.userChoice.catch(() => null);
    pedidoInstalar = null;
    if (r && r.outcome === "accepted") $("#instalar").hidden = true; else $("#instalarBtn").hidden = true;
  };
  $("#instalarFechar").onclick = () => { $("#instalar").hidden = true; guardado.salvar("trela-instalar-fechado", true); };

  function iniciarApp() {
    setTimeout(mostrarInstalar, 1500);
    pilha = []; ir("tHome"); desenharEu();
    marcarPresenca(); batida = setInterval(marcarPresenca, 2 * 60 * 1000);
    const uid = EU.uid;

    // Feed "Rolou hoje"
    // (só o que foi postado desde as 6h; às 6h o feed zera sozinho)
    parar.push(ouvirNoite(desde => db.collection("telao").where("criado", ">=", desde).orderBy("criado", "desc").limit(40).onSnapshot(snap => {
      S.posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.postsMap = new Map(S.posts.map(p => [p.id, p]));
      redesenhar();
    }, () => {})));

    // Amizades
    let primeiraAmizade = true;
    parar.push(db.collection("amizades").where("membros", "array-contains", uid).onSnapshot(snap => {
      snap.docChanges().forEach(c => {
        const d = c.doc.data(), outro = d.membros.find(m => m !== uid);
        if (c.type === "removed") S.amizades.delete(outro); else S.amizades.set(outro, d);
        if (!primeiraAmizade && c.type === "added" && d.para === uid) toast(outro, perfil(outro).nome + " quer ser teu amigo", abrirGalera);
        if (!primeiraAmizade && c.type === "modified" && d.status === "aceita" && d.de === uid) toast(outro, perfil(outro).nome + " aceitou tua amizade", () => abrirChat(outro));
      });
      primeiraAmizade = false; redesenhar();
    }, () => {}));

    // Conversas
    let primeiraConversa = true;
    parar.push(db.collection("conversas").where("membros", "array-contains", uid).onSnapshot(snap => {
      snap.docChanges().forEach(c => {
        const d = c.doc.data(), outro = d.membros.find(m => m !== uid);
        const antes = S.conversas.get(outro);
        S.conversas.set(outro, d);
        const u2 = d.ultima;
        // Só avisa quando chegou mensagem nova (não quando a outra pessoa leu ou apagou)
        const novaMsg = u2 && (!antes || !antes.ultima || ms(u2.criado) !== ms(antes.ultima.criado) || u2.texto !== antes.ultima.texto);
        if (!primeiraConversa && novaMsg && u2.de !== uid && !(telaAtual() === "tChat" && chatCom === outro) && c.type !== "removed")
          toast(outro, perfil(outro).nome + ": " + (ofensivoTexto(u2.texto) ? "mandou uma mensagem" : u2.texto), () => abrirChat(outro));
      });
      primeiraConversa = false; redesenhar();
    }, () => {}));

    // Marcações
    let primeiroAviso = true;
    parar.push(db.collection("avisos").doc(uid).collection("itens").where("lida", "==", false).limit(30).onSnapshot(snap => {
      S.avisos = snap.docs.map(d => ({ id: d.id, ref: d.ref, ...d.data() })).sort((a, b) => ms(b.criado) - ms(a.criado));
      if (!primeiroAviso) snap.docChanges().filter(c => c.type === "added").forEach(c => { const a = c.doc.data(); toast(a.de, a.deNome + " te marcou num comentário", () => { c.doc.ref.update({ lida: true }); abrirComentarios(a.postId); }); });
      primeiroAviso = false; redesenhar();
    }, () => {}));

    // Bloqueios que eu fiz

      if (!estado) return;

      if (jaApareceu) { pararRastreio(); return status("<b>Já passou!</b>Ele volta de vez em quando durante a noite. Manda outro?"); }

      const resta = Math.max(0, estado.dur - (Date.now() - (ms(estado.inicio) || Date.now())) / 1000) + i * estado.dur;

  function sugerir() {

    const q = m[1].toLowerCase();
    const op = candidatos().filter(p => semEspaco(p.nome).toLowerCase().startsWith(q))
      .sort((a, b) => ehAmigo(b.id) - ehAmigo(a.id)).slice(0, 6);
    if (!op.length) { sug.hidden = true; return; }
    sug.replaceChildren(...op.map(p => {

        const antes = ci.value.slice(0, ci.selectionStart).replace(/@[\p{L}\d_]*$/u, "@" + tag + " ");
        ci.value = antes + ci.value.slice(ci.selectionStart); ci.focus(); ci.setSelectionRange(antes.length, antes.length); sug.hidden = true;

    const mencoes = [];

    const motivo = motivoSuspeito(paraFiltro);
    $("#sug").hidden = true; ci.value = ""; escolhidos.clear(); ultimoComentario = Date.now();
    const alvoTexto = (r.texto || "Foto").slice(0, 60);
    const praFila = m => db.collection("fila").add({ tipo: "comentario", autor: EU.uid, nome: EU.nome, texto, cor: "lilas", alvo: r.id, alvoTexto, mencoes, criado: agoraServidor(), motivo: m });
    try {
      if (motivo) { await praFila(motivo); $("#comsAviso").textContent = "Teu comentário vai passar pela equipe antes de aparecer."; $("#comsAviso").hidden = false; return; }
      const batch = db.batch();
      batch.set(db.collection("telao").doc(r.id).collection("comentarios").doc(), { autor: EU.uid, nome: EU.nome, texto, mencoes, criado: agoraServidor() });
      batch.update(db.doc("telao/" + r.id), { ncoms: FS.FieldValue.increment(1), ultimoCom: { nome: EU.nome, texto } });
      try { await batch.commit(); $("#comsAviso").hidden = true; }
      catch (err) { await praFila("Barrado pelo servidor"); $("#comsAviso").textContent = "Teu comentário vai passar pela equipe antes de aparecer."; $("#comsAviso").hidden = false; return; }
      // Avisa quem foi marcado
      mencoes.forEach(m => db.collection("avisos").doc(m.uid).collection("itens").add({ tipo: "mencao", de: EU.uid, deNome: EU.nome, postId: r.id, texto: alvoTexto, criado: agoraServidor(), lida: false }).catch(() => {}));
    } catch (err) { $("#comsAviso").textContent = "Não deu pra enviar. Tenta de novo."; $("#comsAviso").hidden = false; }
  });

  // ================= GALERA =================
  let abaGalera = "amigos";
  function abrirGalera() { ir("tGalera"); renderGalera(); }
  $("#btnGalera").onclick = abrirGalera;
  document.querySelectorAll("#abasGalera button").forEach(b => b.onclick = () => {
    abaGalera = b.dataset.aba;
    document.querySelectorAll("#abasGalera button").forEach(x => x.setAttribute("aria-selected", x === b));
    renderGalera();
  });
  function naoLida(outro) {
    const c = S.conversas.get(outro); if (!c || !c.ultima || c.ultima.de === EU.uid) return false;
    return ms(c.ultima.criado) > ms((c.lidaPor || {})[EU.uid]);
  }
  function renderBadge() {
    const pedidos = [...S.amizades.values()].filter(a => a.status === "pendente" && a.para === EU.uid).length;
    const msgs = [...S.conversas.keys()].filter(u => ehAmigo(u) && naoLida(u)).length;
    const n = pedidos + msgs + S.avisos.length;
    $("#badge").hidden = !n; $("#badge").textContent = n;
  }

  function botaoRelacao(uid, compacto) {
    const rel = relacao(uid), b = el("button", "mini"); b.type = "button";
    if (rel === "amigo") { b.textContent = "Conversar"; b.onclick = () => abrirChat(uid); }
    else if (rel === "enviado") { b.textContent = "Pedido enviado"; b.className = "mini feito"; }
    else if (rel === "recebido") { b.textContent = "Aceitar"; b.className = "mini sim"; b.onclick = () => aceitarAmizade(uid); }
    else if (rel === "bloqueado") { b.textContent = "Desbloquear"; b.onclick = () => desbloquear(uid); }
    else { b.textContent = compacto ? "+ Adicionar" : "Adicionar amigo"; b.className = "mini sim"; b.onclick = () => pedirAmizade(uid); }
    return b;
  }
  async function pedirAmizade(uid) {
    const membros = [EU.uid, uid].sort();
    try { await db.doc("amizades/" + parDe(EU.uid, uid)).set({ membros, de: EU.uid, para: uid, status: "pendente", criado: agoraServidor() }); }
    catch (e) { erroToast("Não deu pra mandar o pedido agora."); }
  }
  const aceitarAmizade = uid => db.doc("amizades/" + parDe(EU.uid, uid)).update({ status: "aceita" }).catch(() => erroToast("Não deu pra aceitar agora."));
  const desfazerAmizade = uid => db.doc("amizades/" + parDe(EU.uid, uid)).delete().catch(() => {});
  async function bloquear(uid) {
    await db.doc("bloqueios/" + EU.uid + "_" + uid).set({ de: EU.uid, alvo: uid, criado: agoraServidor() }).catch(() => {});
    if (S.amizades.has(uid)) await desfazerAmizade(uid);
  }
  const desbloquear = uid => db.doc("bloqueios/" + EU.uid + "_" + uid).delete().catch(() => {});

  function linhaPessoa(uid, sub, subCls, extra, ponto, aoTocar) {
    const row = el("div", "pessoa");
    const ab = el("button", "abrir"); ab.type = "button";
    const t = el("div", "txt"); t.append(el("b", "", perfil(uid).nome), el("span", subCls || "", sub));
    ab.append(avatar(uid), t); ab.onclick = aoTocar || (() => ehAmigo(uid) ? abrirChat(uid) : abrirPerfil(uid));
    row.append(ab); if (ponto) row.append(el("span", "pt")); if (extra) row.append(...[].concat(extra));
    return row;
  }
  function renderGalera() {
    const amigos = [...S.amizades.entries()].filter(([, a]) => a.status === "aceita").map(([u]) => perfil(u));
    const pedidos = [...S.amizades.entries()].filter(([, a]) => a.status === "pendente" && a.para === EU.uid).map(([u]) => u);
    const agora = S.noBar.filter(p => online(p) && !S.bloqueados.has(p.id));
    $("#nAmigos").textContent = amigos.length || ""; $("#nAgora").textContent = agora.length || "";
    const out = [];
    if (abaGalera === "amigos") {
      if (pedidos.length) {
        out.push(el("div", "secao", "Pedidos de amizade"));
        pedidos.forEach(u => {
          const no = el("button", "mini", "Recusar"); no.type = "button"; no.onclick = () => desfazerAmizade(u);
          const sim = el("button", "mini sim", "Aceitar"); sim.type = "button"; sim.onclick = () => aceitarAmizade(u);
          out.push(linhaPessoa(u, "Quer ser teu amigo", "nova", [no, sim], false, () => abrirPerfil(u)));
        });
      }
      if (S.avisos.length) {
        out.push(el("div", "secao", "Te marcaram"));
        S.avisos.slice(0, 8).forEach(a => out.push(linhaPessoa(a.de, "Te marcou em: " + a.texto, "nova", null, true, () => { a.ref.update({ lida: true }).catch(() => {}); abrirComentarios(a.postId); })));
      }
      if (!amigos.length) {
        out.push(el("div", "secao", "Amigos"));
        out.push(el("div", "vazio-s", "Nenhum amigo ainda. Vai em No Trela agora e adiciona a galera."));
      }
      // Conversas: só as que têm mensagem visível pra mim (apagar tira daqui)
      const comConversa = amigos.filter(p => ultimaVisivel(p.id))
        .sort((a, b) => (naoLida(b.id) - naoLida(a.id)) || (ms(ultimaVisivel(b.id).criado) - ms(ultimaVisivel(a.id).criado)));
      if (comConversa.length) {
        out.push(el("div", "secao", "Conversas"));
        comConversa.forEach(p => {
          const ult = ultimaVisivel(p.id), nl = naoLida(p.id);
          const prev = (ult.de === EU.uid ? "Tu: " : "") + (ofensivoTexto(ult.texto) && ult.de !== EU.uid ? "mandou uma mensagem" : ult.texto);
          out.push(linhaPessoa(p.id, prev, nl ? "nova" : (online(p) ? "on" : ""), botaoMais(p.id), nl));
        });
      }
      // Amigos sem conversa aberta
      const semConversa = amigos.filter(p => !ultimaVisivel(p.id)).sort((a, b) => (online(b) - online(a)) || a.nome.localeCompare(b.nome));
      if (semConversa.length) {
        out.push(el("div", "secao", comConversa.length ? "Outros amigos" : "Amigos"));
        semConversa.forEach(p => out.push(linhaPessoa(p.id, online(p) ? "Online agora" : (visto(p.ultimoAcesso) || "Amigo"), online(p) ? "on" : "", botaoMais(p.id))));
      }
      if (amigos.length) out.push(el("p", "nota", "Toca no ⋯ pra apagar a conversa ou desfazer a amizade."));
    } else {
      out.push(el("div", "secao", "Tão no Trela agora"));
      if (!agora.length) out.push(el("div", "vazio-s", "Ainda não chegou ninguém. Chama a galera!"));
      agora.forEach(p => out.push(linhaPessoa(p.id, ehAmigo(p.id) ? "Teu amigo · " + (online(p) ? "online agora" : visto(p.ultimoAcesso).toLowerCase()) : online(p) ? "Online agora" : visto(p.ultimoAcesso), online(p) ? "on" : "", botaoRelacao(p.id, true), false, () => abrirPerfil(p.id))));
      out.push(el("p", "nota", "Aparece aqui só quem está com o app do Trela aberto agora."));
    }
    $("#galeraScroll").replaceChildren(...out);
  }
  // Última mensagem que eu ainda vejo (some se a conversa foi apagada)
  function ultimaVisivel(uid) {
    const ult = S.conversas.get(uid)?.ultima;
    if (!ult) return null;
    if (apagadaAte(uid) && ms(ult.criado) <= apagadaAte(uid)) return null;
    return ult;
  }
  function botaoMais(uid) {
    const b = el("button", "mini mais-p", "⋯"); b.type = "button"; b.setAttribute("aria-label", "Opções de " + perfil(uid).nome);
    b.onclick = e => { e.stopPropagation(); menuPessoa(uid); };
    return b;
  }
  function menuPessoa(uid) {
    const nome = perfil(uid).nome, itens = [avatar(uid, "g"), el("h4", "", nome)];
    itens.push(bt("Conversar", "sim", () => { fecharFolha(); abrirChat(uid); }));
    itens.push(bt("Ver perfil", "", () => { fecharFolha(); abrirPerfil(uid); }));
    if (ultimaVisivel(uid)) itens.push(bt("Apagar conversa", "", () => apagarConversa(uid, nome)));
    itens.push(bt("Desfazer amizade", "perigo", () => confirmarDesfazer(uid)));
    itens.push(bt("Cancelar", "", fecharFolha));
    folha(itens);
  }
  function confirmarDesfazer(uid, depois) {
    const nome = perfil(uid).nome;
    folha([el("h4", "", "Desfazer a amizade com " + nome + "?"),
      el("p", "", "Vocês param de poder conversar e " + nome + " sai da tua lista de amigos. Dá pra adicionar de novo depois."),
      bt("Desfazer amizade", "perigo", async () => { fecharFolha(); await desfazerAmizade(uid); redesenhar(); if (depois) depois(); }),
      bt("Cancelar", "", fecharFolha)]);
  }
  const ofensivoTexto = t => !!t && motivoSuspeito(t) === "Palavrão ou ofensa";

  // ================= PERFIL =================
  let perfilDe = null, postsPerfil = null;
  async function abrirPerfil(uid) {
    if (!uid || uid === EU.uid) return;
    perfilDe = uid; postsPerfil = null; ir("tPerfil"); renderPerfil();
    const s = await db.collection("telao").where("autor", "==", uid).limit(60).get().catch(() => null);
    if (perfilDe !== uid) return;
    postsPerfil = s ? s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ms(b.criado) - ms(a.criado)).slice(0, 15) : [];
    renderPerfil();
  }
  // "Hoje", "Ontem" ou a data (a noite vira às 6h)
  function nomeDoDia(ts) {
    const t = ms(ts); if (!t) return "Hoje";
    const noite = inicioDaNoite().getTime(), dia = 24 * 60 * 60 * 1000;
    if (t >= noite) return "Hoje";
    if (t >= noite - dia) return "Ontem";
    return new Date(t).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" });
  }
  function renderPerfil() {
    const p = perfil(perfilDe);
    $("#perfilTitulo").textContent = p.nome;
    const topo = el("div", "perfil-topo");
    topo.append(avatar(p.id, "g"), el("h4", "", p.nome), el("p", online(p) ? "on" : "", online(p) ? "Online agora" : noBar(p) ? "No Trela hoje · " + visto(p.ultimoAcesso).toLowerCase() : visto(p.ultimoAcesso)));
    const acoes = el("div", "acoes-p"), rel = relacao(p.id);
    if (rel === "recebido") acoes.append(bt("Aceitar amizade", "sim", () => aceitarAmizade(p.id)), bt("Recusar", "", () => desfazerAmizade(p.id)));
    else if (rel === "enviado") acoes.append(bt("Pedido enviado", "", () => {}), bt("Cancelar pedido", "", () => desfazerAmizade(p.id)));
    else if (rel === "amigo") acoes.append(bt("Conversar", "sim", () => abrirChat(p.id)), bt("Desfazer amizade", "", () => confirmarDesfazer(p.id)));
    else { const b = botaoRelacao(p.id); b.className = b.className.replace("mini", "bt"); acoes.append(b); }
    topo.append(acoes);
    const out = [topo];
    if (postsPerfil === null) out.push(el("div", "vazio-s", "Carregando posts…"));
    else if (!postsPerfil.length) out.push(el("div", "secao", "Ainda não postou nada"));
    else {
      out.push(el("div", "secao", "Últimos posts"));
      let diaAnterior = "";
      postsPerfil.forEach(r => {
        const dia = nomeDoDia(r.criado);
        if (dia !== diaAnterior) { out.push(el("div", "dia-p", dia)); diaAnterior = dia; }
        out.push(postCard(S.postsMap.get(r.id) || r));
      });
    }
    $("#perfilScroll").replaceChildren(...out);
  }

  // ================= CHAT (só entre amigos) =================
  let chatCom = null, pararChat = null, mensagens = [];
  function abrirChat(uid) {
    if (!ehAmigo(uid)) return abrirPerfil(uid);
    chatCom = uid; mensagens = []; ir("tChat"); renderChatTopo(); renderChat();
    if (pararChat) pararChat();
    const par = parDe(EU.uid, uid);
    pararChat = db.collection("conversas").doc(par).collection("mensagens").orderBy("criado").limitToLast(150).onSnapshot(s => {
      mensagens = s.docs.map(d => ({ ref: d.ref, ...d.data() })); renderChat(); marcarLida();
    }, () => {});
    marcarLida();
  }
  function fecharChat() { if (pararChat) pararChat(); pararChat = null; chatCom = null; }
  function marcarLida() {
    if (!chatCom || !naoLida(chatCom)) return;
    const par = parDe(EU.uid, chatCom), c = S.conversas.get(chatCom);
    db.doc("conversas/" + par).set({ membros: [EU.uid, chatCom].sort(), lidaPor: { [EU.uid]: agoraServidor() } }, { merge: true }).catch(() => {});
  }
  function renderChatTopo() {
    if (!chatCom) return;
    const p = perfil(chatCom);
    const av = avatar(chatCom); av.id = "chatAv"; $("#chatAv").replaceWith(av);
    $("#chatQuem").replaceChildren(p.nome, el("small", online(p) ? "on" : "", online(p) ? "Online agora" : visto(p.ultimoAcesso)));
    if (!ehAmigo(chatCom)) { $("#chatForm").hidden = true; renderChat(); } else $("#chatForm").hidden = false;
  }
  $("#chatQuem").onclick = () => abrirPerfil(chatCom);
  const revelar = new Set();
  // Até quando a conversa foi apagada "só pra mim"
  const apagadaAte = outro => ms(((S.conversas.get(outro) || {}).apagadaPor || {})[EU.uid]);
  function renderChat() {
    const out = [], corte = apagadaAte(chatCom);
    if (!ehAmigo(chatCom)) out.push(el("div", "sistema", S.bloqueados.has(chatCom) ? "Tu bloqueou essa pessoa." : "Vocês não são mais amigos, então não dá pra mandar mensagem."));
    else if (!mensagens.some(m => !corte || !m.criado || ms(m.criado) > corte)) out.push(el("div", "sistema", corte ? "Conversa apagada. As mensagens novas aparecem aqui." : "Vocês são amigos. Manda um oi!"));
    mensagens.filter(m => !corte || !m.criado || ms(m.criado) > corte).forEach((m, i) => {
      const mine = m.de === EU.uid, chave = ms(m.criado) + ":" + i;
      if (!mine && ofensivoTexto(m.texto) && !revelar.has(chave)) { const o = el("div", "msg dela oculta", "Mensagem pode ser ofensiva · toca pra ver"); o.onclick = () => { revelar.add(chave); renderChat(); }; out.push(o); return; }
      const b = el("div", "msg " + (mine ? "minha" : "dela"), m.texto); b.append(el("small", "", horaDe(m.criado))); out.push(b);
    });
    $("#msgs").replaceChildren(...out);
    const sc = $("#chatScroll"); sc.scrollTop = sc.scrollHeight;
  }
  $("#chatForm").addEventListener("submit", async e => {
    e.preventDefault();
    const inp = $("#chatInput"), texto = inp.value.trim(); if (!texto || !chatCom) return;
    inp.value = "";
    const par = parDe(EU.uid, chatCom), c = S.conversas.get(chatCom) || {};
    const batch = db.batch();
    batch.set(db.collection("conversas").doc(par).collection("mensagens").doc(), { de: EU.uid, texto, criado: agoraServidor() });
    batch.set(db.doc("conversas/" + par), { membros: [EU.uid, chatCom].sort(), ultima: { de: EU.uid, texto: texto.slice(0, 120), criado: agoraServidor() }, lidaPor: { [EU.uid]: agoraServidor() } }, { merge: true });
    try { await batch.commit(); } catch (err) { inp.value = texto; erroToast("Não deu pra enviar. Tenta de novo."); }
  });
  function apagarConversa(uid, nome) {
    const par = parDe(EU.uid, uid);
    const erro = el("p", ""); erro.style.color = "var(--laranja)";
    folha([el("h4", "", "Apagar a conversa com " + nome + "?"),
      el("p", "", "Só pra mim: some do teu celular, mas " + nome + " continua vendo. Pra nós dois: apaga as mensagens dos dois lados."),
      erro,
      bt("Apagar só pra mim", "perigo", async () => {
        try {
          await db.doc("conversas/" + par).set({ membros: [EU.uid, uid].sort(), apagadaPor: { [EU.uid]: agoraServidor() }, lidaPor: { [EU.uid]: agoraServidor() } }, { merge: true });
          fecharFolha(); if (telaAtual() === "tChat") renderChat(); else redesenhar();
        } catch (e) { erro.textContent = "Não deu pra apagar agora. Tenta de novo."; }
      }),
      bt("Apagar pra nós dois", "perigo", async () => {
        try {
          const s = await db.collection("conversas").doc(par).collection("mensagens").get();
          for (let i = 0; i < s.docs.length; i += 400) {
            const b = db.batch(); s.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit();
          }
          await db.doc("conversas/" + par).set({ membros: [EU.uid, uid].sort(), ultima: null }, { merge: true });
          fecharFolha(); if (telaAtual() === "tChat") { mensagens = []; renderChat(); } else redesenhar();
        } catch (e) { erro.textContent = "Não deu pra apagar agora. Tenta de novo."; }
      }),
      bt("Cancelar", "", fecharFolha)]);
  }
  $("#chatMenu").onclick = () => {
    const uid = chatCom, nome = perfil(uid).nome;
    folha([el("h4", "", nome),
      bt("Ver perfil", "", () => { fecharFolha(); abrirPerfil(uid); }),
      bt("Apagar conversa", "", () => apagarConversa(uid, nome)),
      bt("Desfazer amizade", "", () => confirmarDesfazer(uid, voltar)),
      bt("Bloquear", "perigo", async () => { fecharFolha(); await bloquear(uid); voltar(); }),
      bt("Denunciar pra equipe do Trela", "perigo", async () => {
        const ult = [...mensagens].reverse().find(m => m.de === uid);
        try {
          await db.collection("denuncias").add({ de: EU.uid, deNome: EU.nome, contra: uid, contraNome: nome, texto: ult ? ult.texto.slice(0, 500) : "", criado: agoraServidor() });
          await bloquear(uid);
          folha([el("h4", "", "Denúncia enviada"), el("p", "", "A equipe do Trela recebeu e " + nome + " foi bloqueado(a) pra ti."), bt("Ok", "sim", () => { fecharFolha(); voltar(); })]);
        } catch (err) { fecharFolha(); erroToast("Não deu pra denunciar agora. Tenta de novo."); }
      }),
      bt("Cancelar", "", fecharFolha)]);
  };
</script>
</body>
</html>
