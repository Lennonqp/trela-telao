<!doctype html>
<html lang="pt-BR">
<head>
<base href="/teste/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a12">
<title>Agenda · Trela</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="estilo.css?v=202611132152">
<style>
  body{min-height:100dvh;padding:28px 16px calc(32px + env(safe-area-inset-bottom));background:radial-gradient(70% 40% at 15% 0%,rgba(169,92,242,.22),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(255,63,164,.18),transparent 70%),var(--bg)}
  .wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .logo{font-size:48px}
  .logo small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-top:8px}
  .voltar{color:var(--lilas);font-weight:700;text-decoration:none;font-size:14px}
  #porta{display:flex;justify-content:center}
  main{display:flex;flex-direction:column;gap:18px}
  h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--neon)}
  .sub{margin:6px 0 0;color:var(--muted);font-size:14px}
  .painel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
  .painel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;text-transform:uppercase;color:var(--lilas)}
  .painel input,.painel textarea{background:var(--bg)}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .msg{margin:0;font-size:13px;min-height:18px;color:var(--ok)}
  .msg.erro{color:var(--laranja)}
  .vazio{margin:0;color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:14px}
  .sec{font:400 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px;display:flex;justify-content:space-between}
  .item{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--lilas));border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
  .item .quando{font:700 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--lilas))}
  .item b{font-size:17px;overflow-wrap:anywhere}
  .item span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
  .item .bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .item .bts button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:10px 16px;font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
  .item .bts button.sim{background:var(--ok);border-color:var(--ok);color:#06200f}
  .item .bts button.nao{border-color:var(--laranja);color:var(--laranja)}
  .liga{flex-direction:row!important;align-items:center;justify-content:space-between;gap:14px!important;padding:16px 18px!important}
  .liga.on{border-color:var(--neon)}
  .liga-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
  .liga-txt b{font-size:16px}
  .liga-txt span{font-size:13px;color:var(--muted)}
  .liga.on .liga-txt span{color:var(--ink)}
  .chave{position:relative;flex:none;width:52px;height:30px;margin:0;cursor:pointer}
  .chave input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .chave span{pointer-events:none;position:absolute;top:0;left:0;right:0;bottom:0;border-radius:999px;background:var(--line);transition:background .2s}
  .chave span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
  .chave input:checked + span{background:var(--neon)}
  .chave input:checked + span::after{transform:translateX(22px)}
  .chave input:focus-visible + span{outline:2px solid var(--lilas);outline-offset:2px}
  @media (max-width:480px){.dupla{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><img src="logo.svg?v=3" alt="trela"><small>Equipe · agenda</small></div>
    <a class="voltar" href="bar">&lsaquo; Voltar pro painel</a>
  </header>

  <div id="porta"></div>

  <main id="tela" hidden>
    <div>
      <h1>Agenda do <em>Trela</em></h1>
      <p class="sub">As próximas noites aparecem no app, em Agenda do Trela. Quem tocar em "Me avisa" recebe o lembrete no dia.</p>
    </div>

    <form class="painel" id="formAg" novalidate>
      <h2 id="formTit">Nova noite</h2>
      <div><label for="agTitulo">Nome da noite</label><input id="agTitulo" maxlength="60" placeholder="Ex.: Quarta de Karaokê"></div>
      <div class="dupla">
        <div><label for="agData">Dia</label><input id="agData" type="date"></div>
        <div><label for="agHora">Horário</label><input id="agHora" type="time" value="20:00"></div>
      </div>
      <div><label for="agDesc">Descrição (opcional)</label><textarea id="agDesc" maxlength="200" placeholder="Ex.: Open de chopp até às 22h e DJ convidado"></textarea></div>
      <p class="msg" id="agMsg" role="status"></p>
      <button class="btn" type="submit" id="agSalvar">Colocar na agenda</button>
      <button class="ghost" type="button" id="agCancelar" hidden>Cancelar edição</button>
    </form>

    <div class="sec"><span>Próximas noites</span><span id="agN"></span></div>
    <div id="agLista" style="display:flex;flex-direction:column;gap:10px"></div>
  </main>

  <footer class="lennon-pe" data-marca-lennon></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js?v=202611132152"></script>
<script>window.SESSAO_EQUIPE = true;</script>
<script src="marca.js?v=202611132152"></script>
<script src="comum.js?v=202611132152"></script>
<script src="equipe.js?v=202611132152"></script>
<script>
  const $ = id => document.getElementById(id);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const botao = (texto, cls, acao) => { const b = el("button", cls, texto); b.type = "button"; b.onclick = acao; return b; };
  const msg = (id, t, erro) => { $(id).textContent = t; $(id).className = "msg" + (erro ? " erro" : ""); };
  const semPermissao = e => e && e.code === "permission-denied";
  let parar = [];
  // Agenda da semana: /agenda/{id} = { titulo, descricao, data "AAAA-MM-DD", hora "HH:MM", criado, avisado }
  let eventos = [], editando = null;
  function limparForm() { editando = null; $("agTitulo").value = ""; $("agDesc").value = ""; $("agData").value = hojeISO(); $("agHora").value = "20:00"; $("formTit").textContent = "Nova noite"; $("agSalvar").textContent = "Colocar na agenda"; $("agCancelar").hidden = true; }
  $("agCancelar").onclick = () => { limparForm(); msg("agMsg", ""); };
  $("formAg").addEventListener("submit", async e => {
    e.preventDefault();
    const titulo = $("agTitulo").value.replace(/\s+/g, " ").trim(), descricao = $("agDesc").value.replace(/\s+/g, " ").trim(), data = $("agData").value, hora = $("agHora").value;
    if (titulo.length < 2) return msg("agMsg", "Escreve o nome da noite.", true);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) return msg("agMsg", "Escolhe o dia.", true);
    if (data < hojeISO(inicioDaNoite())) return msg("agMsg", "Esse dia já passou.", true);
    $("agSalvar").disabled = true;
    try {
      if (editando) {
        const antes = eventos.filter(x => x.id === editando)[0] || {};
        // mudou o dia: o lembrete vale de novo
        await db.doc("agenda/" + editando).update(Object.assign({ titulo, descricao, data, hora }, antes.data !== data ? { avisado: false } : {}));
        msg("agMsg", "Alteração salva.");
      } else {
        await db.collection("agenda").add({ titulo, descricao, data, hora, avisado: false, criado: agoraServidor() });
        msg("agMsg", titulo + " entrou na agenda.");
      }
      limparForm();
    } catch (err) { msg("agMsg", semPermissao(err) ? "Sem permissão. Publica o firestore.rules de novo." : "Não deu pra salvar. Tenta de novo.", true); }
    $("agSalvar").disabled = false;
  });
  function desenhar() {
    const hoje = hojeISO(inicioDaNoite());
    const prox = eventos.filter(x => x.data >= hoje).sort((a, b) => (a.data + (a.hora || "")).localeCompare(b.data + (b.hora || "")));
    $("agN").textContent = prox.length ? prox.length + (prox.length === 1 ? " noite" : " noites") : "";
    const itens = prox.map(x => {
      const it = el("div", "item"); if (x.data === hoje) it.style.setProperty("--c", "var(--neon)");
      it.append(el("span", "quando", dataBonita(x.data) + (x.hora ? " · " + x.hora : "")), el("b", "", x.titulo));
      if (x.descricao) it.append(el("span", "", x.descricao));
      const avis = el("span", "", "…"); it.append(avis);
      db.collection("agenda").doc(x.id).collection("avisar").get().then(q => { avis.textContent = q.size + (q.size === 1 ? " pessoa pediu pra ser avisada" : " pessoas pediram pra ser avisadas") + (x.avisado ? " · lembrete já enviado" : ""); }).catch(() => { avis.textContent = x.avisado ? "Lembrete já enviado" : ""; });
      const bts = el("div", "bts");
      bts.append(botao("Editar", "", () => { editando = x.id; $("agTitulo").value = x.titulo; $("agDesc").value = x.descricao || ""; $("agData").value = x.data; $("agHora").value = x.hora || ""; $("formTit").textContent = "Editar noite"; $("agSalvar").textContent = "Salvar alteração"; $("agCancelar").hidden = false; msg("agMsg", ""); $("formAg").scrollIntoView({ behavior: "smooth", block: "start" }); }),
        botao("Tirar da agenda", "nao", () => db.doc("agenda/" + x.id).delete().then(() => msg("agMsg", x.titulo + " saiu da agenda.")).catch(() => msg("agMsg", "Não deu pra tirar.", true))));
      it.append(bts); return it;
    });
    $("agLista").replaceChildren(...(itens.length ? itens : [el("p", "vazio", "Nenhuma noite na agenda. Cadastra a primeira aí em cima.")]));
  }
  limparForm();
  portaEquipe($("porta"), () => {
    $("tela").hidden = false;
    parar.push(db.collection("agenda").onSnapshot(s => {
      eventos = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
      // o que já passou sai sozinho (a equipe apaga)
      const hoje = hojeISO(inicioDaNoite());
      eventos.filter(x => x.data < hoje).forEach(x => db.doc("agenda/" + x.id).delete().catch(() => {}));
      desenhar();
    }, e => { $("agLista").replaceChildren(el("p", "vazio", semPermissao(e) ? "As regras do Firestore estão desatualizadas. Publica o firestore.rules de novo." : "Não deu pra carregar a agenda.")); }));
  }, () => { parar.forEach(f => f()); parar = []; $("tela").hidden = true; });
</script>
</body>
</html>
