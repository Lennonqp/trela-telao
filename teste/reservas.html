<!doctype html>
<html lang="pt-BR">
<head>
<base href="/teste/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a12">
<title>Reservas · Trela</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="estilo.css?v=202611161736">
<style>
  body{min-height:100dvh;padding:28px 16px calc(32px + env(safe-area-inset-bottom));background:radial-gradient(70% 40% at 15% 0%,rgba(169,92,242,.22),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(255,63,164,.18),transparent 70%),var(--bg)}
  .wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .logo{font-size:48px}
  .logo small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-top:8px}
  .voltar{color:var(--lilas);font-weight:700;text-decoration:none;font-size:14px}
  #porta{display:flex;justify-content:center}
  main{display:flex;flex-direction:column;gap:18px}
  h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--neon)}
  .sub{margin:6px 0 0;color:var(--muted);font-size:14px}
  .painel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
  .painel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;text-transform:uppercase;color:var(--lilas)}
  .painel input,.painel textarea{background:var(--bg)}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .msg{margin:0;font-size:13px;min-height:18px;color:var(--ok)}
  .msg.erro{color:var(--laranja)}
  .vazio{margin:0;color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:14px}
  .sec{font:400 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px;display:flex;justify-content:space-between}
  .item{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--lilas));border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
  .item .quando{font:700 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--lilas))}
  .item b{font-size:17px;overflow-wrap:anywhere}
  .item span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
  .item .bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .item .bts button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:10px 16px;font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
  .item .bts button.sim{background:var(--ok);border-color:var(--ok);color:#06200f}
  .item .bts button.nao{border-color:var(--laranja);color:var(--laranja)}
  .tripla{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .opcoes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opcoes button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:700 13px/1.2 var(--f-body);cursor:pointer}
  .opcoes button[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:rgba(255,255,255,.04)}
  .dia{display:flex;flex-direction:column;gap:10px}
  .dia-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
  .dia-topo b{font:400 22px/1 var(--f-display);text-transform:uppercase}
  .dia-topo span{font:400 12px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.04em}
  .selo{align-self:flex-start;border:1px solid var(--c);color:var(--c)!important;border-radius:999px;padding:4px 10px;font:700 11px/1 var(--f-mono)!important;letter-spacing:.08em;text-transform:uppercase}
  .resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .resumo div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
  .resumo b{font:400 28px/1 var(--f-display)}
  .resumo span{font-size:12px;color:var(--muted)}
  @media (max-width:480px){.dupla{grid-template-columns:1fr}.tripla{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><img src="logo.svg?v=3" alt="trela"><small>Equipe · reservas</small></div>
    <a class="voltar" href="bar">&lsaquo; Voltar pro painel</a>
  </header>

  <div id="porta"></div>

  <main id="tela" hidden>
    <div>
      <h1>Reservas de <em>mesa</em></h1>
      <p class="sub">Controle da equipe: anota aqui as reservas que chegam (WhatsApp, telefone, balcão) e marca se cada uma já está confirmada. Não aparece no app da galera.</p>
    </div>

    <div class="resumo" id="rsResumo"></div>

    <form class="painel" id="rsForm" autocomplete="off">
      <h2 id="rsTitulo">Nova reserva</h2>
      <div class="dupla">
        <div><label for="rsNome">Nome de quem reservou</label><input id="rsNome" maxlength="40" placeholder="Ex.: Mariana"></div>
        <div><label for="rsTel">Telefone (opcional)</label><input id="rsTel" type="tel" maxlength="20" placeholder="(51) 90000-0000"></div>
      </div>
      <div class="dupla">
        <div><label for="rsData">Dia</label><input id="rsData" type="date"></div>
        <div><label for="rsHora">Horário</label><input id="rsHora" type="time" value="21:00"></div>
      </div>
      <div class="dupla">
        <div><label for="rsPessoas">Quantas pessoas</label><input id="rsPessoas" type="number" inputmode="numeric" min="1" max="200" value="4"></div>
        <div><label for="rsMesas">Quantas mesas</label><input id="rsMesas" type="number" inputmode="numeric" min="1" max="50" value="1"></div>
      </div>
      <div><label for="rsObs">Observação (opcional)</label><input id="rsObs" maxlength="120" placeholder="Ex.: aniversário, mesa perto do palco"></div>
      <div>
        <label>Situação</label>
        <div class="opcoes" id="rsStatus">
          <button type="button" data-st="pendente" style="--c:#ffd166" aria-pressed="true">A confirmar</button>
          <button type="button" data-st="confirmada" style="--c:var(--ok)" aria-pressed="false">Confirmada</button>
        </div>
      </div>
      <p class="msg" id="rsMsg" role="status"></p>
      <button class="btn" type="submit" id="rsSalvar">Anotar reserva</button>
      <button class="ghost" type="button" id="rsCancelar" hidden>Cancelar edição</button>
    </form>

    <div id="rsLista" style="display:flex;flex-direction:column;gap:22px"></div>
  </main>

  <footer class="lennon-pe" data-marca-lennon></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js?v=202611161736"></script>
<script>window.SESSAO_EQUIPE = true;</script>
<script src="marca.js?v=202611161736"></script>
<script src="comum.js?v=202611161736"></script>
<script src="equipe.js?v=202611161736"></script>
<script>
  const $ = id => document.getElementById(id);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const botao = (texto, cls, acao) => { const b = el("button", cls, texto); b.type = "button"; b.onclick = acao; return b; };
  const msg = (id, t, erro) => { $(id).textContent = t; $(id).className = "msg" + (erro ? " erro" : ""); };
  const semPermissao = e => e && e.code === "permission-denied";
  let parar = [];
  // Reservas (controle da equipe): /reservas/{id} = { nome, tel, data, hora, pessoas, mesas, obs, status: "pendente" | "confirmada", criado }
  let reservas = [], editando = null, statusForm = "pendente";
  const limpo = (v, n) => String(v || "").replace(/\s+/g, " ").trim().slice(0, n);
  const confirmada = r => r.status === "confirmada";
  const plural = (n, um, varios) => n + " " + (n === 1 ? um : varios);
  function marcarStatus(st) { statusForm = st; $("rsStatus").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.st === st))); }
  $("rsStatus").onclick = e => { const b = e.target.closest("button"); if (b) marcarStatus(b.dataset.st); };
  function limparForm() {
    editando = null; $("rsNome").value = ""; $("rsTel").value = ""; $("rsObs").value = ""; $("rsPessoas").value = 4; $("rsMesas").value = 1;
    marcarStatus("pendente"); $("rsTitulo").textContent = "Nova reserva"; $("rsSalvar").textContent = "Anotar reserva"; $("rsCancelar").hidden = true;
  }
  function editar(r) {
    editando = r.id; $("rsNome").value = r.nome || ""; $("rsTel").value = r.tel || ""; $("rsData").value = r.data; $("rsHora").value = r.hora; $("rsPessoas").value = r.pessoas || 1; $("rsMesas").value = r.mesas || 1; $("rsObs").value = r.obs || "";
    marcarStatus(confirmada(r) ? "confirmada" : "pendente"); $("rsTitulo").textContent = "Editar reserva"; $("rsSalvar").textContent = "Salvar alteração"; $("rsCancelar").hidden = false; msg("rsMsg", "");
    $("rsForm").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  $("rsCancelar").onclick = () => { limparForm(); msg("rsMsg", ""); };
  $("rsForm").onsubmit = async e => {
    e.preventDefault();
    const nome = limpo($("rsNome").value, 40), data = $("rsData").value, hora = $("rsHora").value;
    const pessoas = parseInt($("rsPessoas").value, 10), mesas = parseInt($("rsMesas").value, 10);
    if (!nome) return msg("rsMsg", "Escreve o nome de quem reservou.", true);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) return msg("rsMsg", "Escolhe o dia da reserva.", true);
    if (data < hojeISO(inicioDaNoite())) return msg("rsMsg", "Esse dia já passou.", true);
    if (!/^\d{2}:\d{2}$/.test(hora)) return msg("rsMsg", "Escolhe o horário.", true);
    if (!(pessoas >= 1 && pessoas <= 200)) return msg("rsMsg", "A quantidade de pessoas vai de 1 a 200.", true);
    if (!(mesas >= 1 && mesas <= 50)) return msg("rsMsg", "A quantidade de mesas vai de 1 a 50.", true);
    const d = { nome, tel: limpo($("rsTel").value, 20), data, hora, pessoas, mesas, obs: limpo($("rsObs").value, 120), status: statusForm };
    $("rsSalvar").disabled = true;
    try {
      if (editando) await db.doc("reservas/" + editando).update(d);
      else await db.collection("reservas").add(Object.assign(d, { criado: agoraServidor() }));
      const era = editando; limparForm(); $("rsData").value = data;
      msg("rsMsg", era ? "Reserva de " + nome + " atualizada." : "Reserva de " + nome + " anotada.");
    } catch (err) { msg("rsMsg", semPermissao(err) ? "Sem permissão. Publica o firestore.rules de novo." : "Não deu pra salvar. Tenta de novo.", true); }
    $("rsSalvar").disabled = false;
  };
  function mudarStatus(r, st) {
    db.doc("reservas/" + r.id).update({ status: st }).then(() => msg("rsMsg", "Reserva de " + r.nome + (st === "confirmada" ? " confirmada." : " voltou pra a confirmar.")))
      .catch(err => msg("rsMsg", semPermissao(err) ? "Sem permissão. Publica o firestore.rules de novo." : "Não deu pra mudar. Tenta de novo.", true));
  }
  function cartao(r) {
    const ok = confirmada(r), it = el("div", "item"); it.style.setProperty("--c", ok ? "var(--ok)" : "#ffd166");
    const sl = el("span", "selo", ok ? "Confirmada" : "A confirmar");
    it.append(el("span", "quando", r.hora), el("b", "", r.nome), el("span", "", plural(r.pessoas || 1, "pessoa", "pessoas") + " · " + plural(r.mesas || 1, "mesa", "mesas")), sl);
    if (r.tel) it.append(el("span", "", "Telefone: " + r.tel));
    if (r.obs) it.append(el("span", "", "Observação: " + r.obs));
    const bts = el("div", "bts");
    bts.append(ok ? botao("Voltar pra a confirmar", "", () => mudarStatus(r, "pendente")) : botao("Confirmar", "sim", () => mudarStatus(r, "confirmada")),
      botao("Editar", "", () => editar(r)),
      botao("Apagar", "nao", () => { if (editando === r.id) limparForm(); db.doc("reservas/" + r.id).delete().then(() => msg("rsMsg", "Reserva de " + r.nome + " apagada.")).catch(() => msg("rsMsg", "Não deu pra apagar.", true)); }));
    it.append(bts); return it;
  }
  function desenhar() {
    const hoje = hojeISO(inicioDaNoite());
    const vale = reservas.filter(r => r.data >= hoje).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
    const soma = (l, k) => l.reduce((n, r) => n + (r[k] || 1), 0);
    const doDia = vale.filter(r => r.data === hoje);
    const quadro = (n, t) => { const d = el("div"); d.append(el("b", "", String(n)), el("span", "", t)); return d; };
    $("rsResumo").replaceChildren(quadro(doDia.length, "reservas hoje"), quadro(soma(doDia, "mesas"), "mesas hoje"), quadro(vale.filter(r => !confirmada(r)).length, "a confirmar no total"));
    const dias = []; vale.forEach(r => { let d = dias.find(x => x.data === r.data); if (!d) dias.push(d = { data: r.data, itens: [] }); d.itens.push(r); });
    $("rsLista").replaceChildren(...(dias.length ? dias.map(d => {
      const box = el("div", "dia"), topo = el("div", "dia-topo"), conf = d.itens.filter(confirmada).length;
      topo.append(el("b", "", dataBonita(d.data)), el("span", "", plural(d.itens.length, "reserva", "reservas") + " · " + plural(soma(d.itens, "mesas"), "mesa", "mesas") + " · " + plural(soma(d.itens, "pessoas"), "pessoa", "pessoas") + " · " + conf + (conf === 1 ? " confirmada" : " confirmadas") + (d.itens.length - conf ? " · " + (d.itens.length - conf) + " a confirmar" : "")));
      box.append(topo, ...d.itens.map(cartao)); return box;
    }) : [el("p", "vazio", "Nenhuma reserva anotada. Usa o formulário acima pra anotar a primeira.")]));
  }
  $("rsData").value = hojeISO(inicioDaNoite()); $("rsData").min = hojeISO(inicioDaNoite());
  portaEquipe($("porta"), () => {
    $("tela").hidden = false;
    parar.push(db.collection("reservas").onSnapshot(s => {
      reservas = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
      // reservas de dias que já passaram saem sozinhas
      const hoje = hojeISO(inicioDaNoite());
      reservas.filter(r => r.data < hoje).forEach(r => db.doc("reservas/" + r.id).delete().catch(() => {}));
      desenhar();
    }, e => { $("rsLista").replaceChildren(el("p", "vazio", semPermissao(e) ? "As regras do Firestore estão desatualizadas. Publica o firestore.rules de novo." : "Não deu pra carregar as reservas.")); }));
  }, () => { parar.forEach(f => f()); parar = []; $("tela").hidden = true; });
</script>
</body>
</html>
